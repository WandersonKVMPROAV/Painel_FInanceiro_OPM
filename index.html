<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KVM Pro AV | Saving com freelancers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1C7A88; --teal-dark:#125A66; --navy:#2E4756; --gold:#D9A04B;
  --sage:#4C8B6E; --plum:#6B5CA5; --terracotta:#C1584B;

  --bg:#F2F5F5; --surface:#FFFFFF; --surface-2:#F5F8F8; --border:#DFE6E5;
  --text:#20303A; --text-muted:#5C6870; --teal-tint:#E4F1F2;

  --c-sav:#1C7A88; --c-gasto:#9AAEB8; --c-neg:#C1584B; --c-ok:#3E8A64; --c-mid:#C28526;
  --c-y25:#6B5CA5; --c-y26:#C28526;
  --map-land:#E3EBEB; --map-stroke:#FFFFFF; --map-bg:#F5F8F8;

  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-1:0 1px 2px rgba(32,48,58,.06);
  --shadow-2:0 10px 30px rgba(20,32,40,.18);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1517; --surface:#182024; --surface-2:#141B1E; --border:#283134;
    --text:#EAF0EF; --text-muted:#93A2A6; --teal-tint:#0F3339;
    --c-sav:#38B3C2; --c-gasto:#5B7482; --c-neg:#E27C6F; --c-ok:#5FB58C; --c-mid:#E2AB55;
    --c-y25:#A194DD; --c-y26:#E2AB55;
    --map-land:#223035; --map-stroke:#141B1E; --map-bg:#141B1E;
    --shadow-1:0 1px 2px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1517; --surface:#182024; --surface-2:#141B1E; --border:#283134;
  --text:#EAF0EF; --text-muted:#93A2A6; --teal-tint:#0F3339;
  --c-sav:#38B3C2; --c-gasto:#5B7482; --c-neg:#E27C6F; --c-ok:#5FB58C; --c-mid:#E2AB55;
  --c-y25:#A194DD; --c-y26:#E2AB55;
  --map-land:#223035; --map-stroke:#141B1E; --map-bg:#141B1E;
  --shadow-1:0 1px 2px rgba(0,0,0,.25);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{box-sizing:inherit;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;
  font-size:14px; line-height:1.45;
}
h1,h2,h3,.font-display{font-family:'Space Grotesk','Inter',system-ui,sans-serif;}
button,select,input{font-family:inherit;}
.num{font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

/* ===== Shell ===== */
.app-shell{ display:flex; min-height:100%; }
.sidebar{
  width:236px; flex:none; background:var(--navy); color:#fff;
  display:flex; flex-direction:column; padding:20px 14px 16px;
  position:sticky; top:env(safe-area-inset-top,0px);
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); overflow-y:auto;
}
.sidebar-brand{ display:flex; flex-direction:column; gap:10px; padding:2px 8px 18px; border-bottom:1px solid rgba(255,255,255,.14); margin-bottom:12px; }
.sidebar-brand img{ height:34px; width:auto; align-self:flex-start; }
.sidebar-brand .subtitle{ font-size:12px; color:rgba(255,255,255,.7); line-height:1.35; }
.sidebar-nav{ display:flex; flex-direction:column; gap:3px; }
.sidebar-nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:rgba(255,255,255,.74); font-size:13.5px; font-weight:600; cursor:pointer;
  background:transparent; border:none; text-align:left; width:100%;
  transition:background .12s ease, color .12s ease;
}
.sidebar-nav-item:hover{ background:rgba(255,255,255,.08); color:#fff; }
.sidebar-nav-item.active{ background:var(--teal); color:#fff; }
.sidebar-nav-item .icon{ font-size:15px; width:18px; text-align:center; flex:none; }
.sidebar-foot{ margin-top:auto; padding:14px 8px 0; border-top:1px solid rgba(255,255,255,.12); font-size:11.5px; color:rgba(255,255,255,.6); line-height:1.5; }

.main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
.app-shell.side-hidden .sidebar{ display:none; }
.app-shell.side-hidden main{ max-width:1520px; }
.tb-lead{ display:flex; align-items:center; gap:10px; }
.btn-icon{ width:36px; height:36px; padding:0; justify-content:center; font-size:17px; line-height:1; }
.tb-title{ font-family:'Space Grotesk','Inter',sans-serif; font-weight:700; font-size:15px; white-space:nowrap; margin-right:6px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.main-topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:10px 22px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
}
main{ max-width:1340px; width:100%; margin:0 auto; padding:20px 20px 60px; }

@media (max-width:860px){
  .app-shell{ flex-direction:column; }
  .sidebar{ width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto; }
  .sidebar-brand{ border-bottom:none; border-right:1px solid rgba(255,255,255,.14); margin-bottom:0; padding:0 12px 0 2px; flex:none; }
  .sidebar-brand img{ height:24px; }
  .sidebar-brand .subtitle, .sidebar-foot{ display:none; }
  .sidebar-nav{ flex-direction:row; padding-left:10px; }
  .sidebar-nav-item{ white-space:nowrap; }
  .main-topbar{ position:static; padding:10px 12px; }
  main{ padding:14px 12px 48px; }
}

/* ===== Filtros ===== */
.flt{ display:inline-flex; align-items:center; gap:2px; border:1px solid var(--border); background:var(--surface-2); border-radius:var(--radius-sm); padding:0 2px 0 10px; }
.flt > span{ font-size:12px; color:var(--text-muted); font-weight:600; }
.flt select{ border:0; background:transparent; color:var(--text); font-weight:600; padding:8px 6px; font-size:13px; cursor:pointer; max-width:190px; }
.flt select option{ background:var(--surface); color:var(--text); }
.flt.is-set{ border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); }
.flt.is-off{ opacity:.45; }
.topbar-right{ margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.btn{ border:none; padding:8px 14px; border-radius:var(--radius-sm); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:13px; }
.btn-primary{ background:var(--teal); color:#fff; }
.btn-primary:hover{ background:var(--teal-dark); }
.btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
.btn-ghost:hover{ background:var(--surface-2); }

.seg{ display:inline-flex; border:1px solid var(--border); border-radius:9px; padding:2px; background:var(--surface-2); gap:2px; }
.seg button{ border:0; background:transparent; padding:6px 11px; border-radius:7px; font-weight:600; font-size:12.5px; color:var(--text-muted); cursor:pointer; white-space:nowrap; }
.seg button[aria-pressed="true"]{ background:var(--teal); color:#fff; }
.seg button:not([aria-pressed="true"]):hover{ color:var(--text); }

/* ===== Cabeçalho de página ===== */
.page-banner{
  background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
  color:#fff; border-radius:var(--radius-lg); padding:16px 22px;
  position:relative; overflow:hidden; margin-bottom:16px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.page-banner::after{ content:""; position:absolute; top:-40px; right:-30px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.07); pointer-events:none; }
.page-banner h2{ margin:0; font-size:19px; position:relative; }
.page-banner p{ margin:2px 0 0; font-size:13px; color:rgba(255,255,255,.8); position:relative; max-width:62ch; }
.page-banner input{ position:relative; z-index:1; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:#fff; border-radius:var(--radius-sm); padding:9px 12px; font-size:13.5px; min-width:240px; }
.page-banner input::placeholder{ color:rgba(255,255,255,.7); }

/* ===== Hero ===== */
.dash-hero-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.dash-hero-card{
  position:relative; overflow:hidden; border-radius:var(--radius-lg);
  background:linear-gradient(135deg, var(--navy) 0%, var(--teal-dark) 100%);
  color:#fff; padding:20px 24px; min-height:150px;
}
.dash-hero-card::after{ content:""; position:absolute; top:-40px; right:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.06); pointer-events:none; }
.dash-hero-label{ font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); position:relative; }
.dash-hero-big{ font-family:'Space Grotesk',sans-serif; font-size:34px; font-weight:700; margin:4px 0 2px; position:relative; line-height:1.1; }
.dash-hero-sub{ font-size:13px; color:rgba(255,255,255,.8); margin-bottom:14px; position:relative; max-width:52ch; }
.dash-hero-items{ display:flex; flex-wrap:wrap; gap:10px; position:relative; }
.dash-hero-item{ background:rgba(255,255,255,.12); border-radius:12px; padding:9px 13px; min-width:140px; }
.dash-hero-item.warn{ background:rgba(217,160,75,.22); box-shadow:inset 0 0 0 1px rgba(217,160,75,.45); }
.dash-hero-item .i-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:#fff; }
.dash-hero-item .i-sub{ font-size:11.5px; color:rgba(255,255,255,.82); margin-top:2px; }

/* ===== Indicadores ===== */
.dash-stats-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
.dash-stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:15px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-1); min-width:0; }
.dash-stat-icon{ width:40px; height:40px; border-radius:10px; background:var(--teal-tint); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
.dash-stat-value{ font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:700; white-space:nowrap; }
.dash-stat-label{ font-size:12.5px; font-weight:600; margin-top:1px; }
.dash-stat-hint{ font-size:11.5px; color:var(--text-muted); }
@media (max-width:1060px){ .dash-stats-row{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:760px){ .dash-hero-row{ grid-template-columns:1fr; } .dash-hero-big{ font-size:30px; } }
@media (max-width:440px){ .dash-stats-row{ grid-template-columns:1fr; } }

/* ===== Cards ===== */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:16px 18px 18px; box-shadow:var(--shadow-1); min-width:0; }
.card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px 14px; flex-wrap:wrap; margin-bottom:12px; }
.card-head h3{ margin:0; font-size:16px; font-weight:700; }
.card-head p{ margin:3px 0 0; font-size:12.5px; color:var(--text-muted); max-width:64ch; }
.row-map{ display:grid; grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr); gap:16px; margin-bottom:16px; }
.row-2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-bottom:16px; }
.row-2b{ display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
@media (max-width:1060px){ .row-map, .row-2, .row-2b{ grid-template-columns:1fr; } }

.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--text-muted); }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.legend i.dot{ border-radius:50%; }
.legend i.hatch{ background:repeating-linear-gradient(45deg, var(--c-sav) 0 2px, transparent 2px 5px) !important; box-shadow:inset 0 0 0 1px var(--c-sav); }

/* ===== Leitura rápida ===== */
.insights{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; margin-bottom:16px; padding:0; overflow:hidden; }
.insight{ padding:14px 18px; display:flex; gap:12px; align-items:flex-start; }
.insight + .insight{ border-left:1px solid var(--border); }
.insight .mark{ width:6px; align-self:stretch; border-radius:4px; flex:none; background:var(--c-sav); }
.insight b{ font-family:'Space Grotesk',sans-serif; font-size:15px; display:block; margin-bottom:2px; }
.insight span{ font-size:12.5px; color:var(--text-muted); }
@media (max-width:900px){ .insights{ grid-template-columns:1fr; } .insight + .insight{ border-left:0; border-top:1px solid var(--border); } }

/* ===== Mapa ===== */
.map-wrap{ position:relative; height:clamp(380px, 60vh, 580px); border-radius:var(--radius-md); background:var(--map-bg); overflow:hidden; touch-action:pan-y pinch-zoom; }
.map-svg{ width:100%; height:100%; display:block; cursor:grab; user-select:none; -webkit-user-select:none; }
.map-svg.dragging{ cursor:grabbing; }
.map-svg .uf{ fill:var(--map-land); stroke:var(--map-stroke); stroke-width:1.2; vector-effect:non-scaling-stroke; transition:fill .15s; }
.map-svg .uf.has{ cursor:pointer; }
.map-svg .uf.has:hover{ filter:brightness(1.12); }
.map-svg .uf.sel{ stroke:var(--gold); stroke-width:2.2; }
.map-svg .uf-lbl{ fill:var(--text-muted); font-weight:700; text-anchor:middle; dominant-baseline:middle; pointer-events:none; opacity:.8; font-family:'Inter',system-ui,sans-serif; }
.map-svg .pt{ stroke:var(--map-bg); stroke-width:1.4; vector-effect:non-scaling-stroke; fill-opacity:.82; cursor:pointer; transition:fill-opacity .12s; }
.map-svg .pt:hover{ fill-opacity:1; }
.map-svg .pt.sel{ stroke:var(--text); stroke-width:2.6; fill-opacity:1; }
.map-svg .pt.dim{ fill-opacity:.25; }
.map-svg .pt-lbl{ fill:var(--text); font-weight:600; pointer-events:none; paint-order:stroke; stroke:var(--map-bg); stroke-width:3px; stroke-linejoin:round; font-family:'Inter',system-ui,sans-serif; }
.map-ctrl{ position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:6px; }
.map-ctrl button{ width:34px; height:34px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:17px; font-weight:700; cursor:pointer; box-shadow:var(--shadow-1); display:flex; align-items:center; justify-content:center; }
.map-ctrl button:hover{ background:var(--surface-2); }
.map-legend{ position:absolute; left:10px; bottom:10px; background:color-mix(in srgb, var(--surface) 88%, transparent); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:4px; max-width:calc(100% - 64px); }
.map-legend .lg-row{ display:flex; align-items:center; gap:7px; }
.map-legend i{ width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
.map-hint{ position:absolute; right:10px; bottom:10px; font-size:11px; color:var(--text-muted); background:color-mix(in srgb, var(--surface) 80%, transparent); padding:3px 7px; border-radius:6px; }
@media (max-width:640px){ .map-hint{ display:none; } .map-wrap{ height:400px; } }

/* ===== Painel lateral ===== */
.side{ display:flex; flex-direction:column; }
.side-scroll{ overflow-y:auto; max-height:clamp(380px, 60vh, 580px); margin:0 -6px; padding:0 6px; }
.bar-list{ display:flex; flex-direction:column; gap:4px; }
.bar-item{ display:grid; grid-template-columns:38px minmax(0,1fr) auto; align-items:center; gap:10px; padding:7px 8px; border-radius:9px; border:1px solid transparent; background:transparent; color:var(--text); text-align:left; cursor:pointer; width:100%; font-size:13px; }
.bar-item:hover{ background:var(--surface-2); }
.bar-item.sel{ border-color:var(--teal); background:var(--teal-tint); }
.bar-item .k{ font-weight:700; font-family:'Space Grotesk',sans-serif; }
.bar-item .track{ height:8px; border-radius:6px; background:var(--surface-2); overflow:hidden; position:relative; }
.bar-item .fill{ position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--c-sav); }
.bar-item .fill.neg{ background:var(--c-neg); }
.bar-item .v{ font-weight:600; font-size:12.5px; white-space:nowrap; }
.bar-item .nm{ font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bar-item{ grid-template-columns:38px minmax(0,1fr) 84px; }
.bar-item .v{ text-align:right; }
.bar-item.wide{ grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 84px; }
@media (max-width:640px){
  .main-topbar{ display:grid; grid-template-columns:1fr 1fr; }
  .flt{ min-width:0; }
  .flt select{ width:100%; max-width:none; min-width:0; }
  .main-topbar .seg, .topbar-right, .tb-lead{ grid-column:1 / -1; }
  .topbar-right{ margin-left:0; }
}

.detail-head{ display:flex; align-items:flex-start; gap:10px; justify-content:space-between; margin-bottom:12px; }
.detail-head h3{ margin:0; font-size:18px; }
.detail-head p{ margin:2px 0 0; color:var(--text-muted); font-size:12.5px; }
.kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
.kpi{ background:var(--surface-2); border-radius:10px; padding:9px 11px; }
.kpi .l{ font-size:11.5px; color:var(--text-muted); }
.kpi .v{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; }
.mini-title{ font-size:12.5px; font-weight:700; margin:12px 0 6px; color:var(--text-muted); }
.site-item{ padding:9px 0; border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; font-size:13px; }
.site-item .s1{ font-weight:600; }
.site-item .s2{ font-size:12px; color:var(--text-muted); }
.site-item .sv{ text-align:right; white-space:nowrap; font-weight:600; }
.pos{ color:var(--c-sav); } .neg{ color:var(--c-neg); }

.badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; white-space:nowrap; }
.badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.badge.done{ color:var(--c-ok); background:color-mix(in srgb, var(--c-ok) 14%, transparent); }
.badge.open{ color:var(--c-mid); background:color-mix(in srgb, var(--c-mid) 16%, transparent); }
.badge.late{ color:var(--c-neg); background:color-mix(in srgb, var(--c-neg) 14%, transparent); }
.badge.future{ color:var(--text-muted); background:color-mix(in srgb, var(--c-gasto) 20%, transparent); }
.badge.kvm{ color:var(--c-y25); background:color-mix(in srgb, var(--c-y25) 16%, transparent); }

/* ===== Gráficos SVG ===== */
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart text{ font-family:'Inter',system-ui,sans-serif; }
.chart .ax{ fill:var(--text-muted); font-size:11px; }
.chart .grid{ stroke:var(--border); stroke-width:1; }
.chart .zero{ stroke:var(--text-muted); stroke-width:1; opacity:.6; }
.chart .lbl{ fill:var(--text); font-size:11.5px; font-weight:700; }
.chart .lbl-s{ fill:var(--text-muted); font-size:10.5px; }
.chart .grp{ fill:var(--text); font-size:12.5px; font-weight:700; }
.chart .hit{ cursor:pointer; }
.chart .hit:hover rect.seg-r{ filter:brightness(1.1); }
.chart .dimmed{ opacity:.3; }

/* ===== Tabela ===== */
.tbl-wrap{ overflow-x:auto; }
.tbl{ width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
.tbl th{ font-size:12px; color:var(--text-muted); font-weight:600; text-align:right; padding:8px 7px; border-bottom:1px solid var(--border); white-space:nowrap; }
.tbl td{ padding:9px 7px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
.tbl th:first-child, .tbl td:first-child{ text-align:left; padding-left:2px; }
.tbl.cmp td:first-child{ white-space:normal; min-width:72px; }
.tbl tr.total td{ font-weight:700; border-bottom:0; }
.tbl tr.var td{ color:var(--text-muted); font-size:12.5px; border-bottom:0; }
.tbl th.sort{ cursor:pointer; user-select:none; }
.tbl th.sort:hover{ color:var(--text); }
.tbl th.sort.on{ color:var(--text); }
.tbl td.txt, .tbl th.txt{ text-align:left; }
.tbl tbody tr.click{ cursor:pointer; }
.tbl tbody tr.click:hover td{ background:var(--surface-2); }
.tbl tr.open td{ background:var(--surface-2); }
.tbl tr.sub td{ background:var(--surface-2); padding:4px 10px 14px; white-space:normal; }
.cyc-mini{ display:grid; grid-template-columns:repeat(auto-fill,minmax(122px,1fr)); gap:8px; }
.cyc-mini > div{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:7px 9px; font-size:12px; text-align:left; }
.cyc-mini b{ display:block; font-size:12px; color:var(--text); font-weight:700; margin-bottom:3px; }
.cyc-mini b .ms{ display:block; font-weight:500; color:var(--text-muted); font-size:11px; }
.cyc-mini .rr{ display:flex; justify-content:space-between; gap:6px; white-space:nowrap; font-size:11.5px; color:var(--text-muted); }
.cyc-mini .rr span:last-child{ color:var(--text); }
.cyc-mini .rr span.pos{ color:var(--c-sav); } .cyc-mini .rr span.neg{ color:var(--c-neg); }
.cyc-mini .badge{ font-size:10.5px; padding:1px 7px; margin-top:5px; }
.wrap-cell{ white-space:normal !important; min-width:150px; }
.cell-sub{ font-size:11.5px; color:var(--text-muted); margin-top:2px; font-weight:400; }

/* ===== Andamento ===== */
.cyc-tiles{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; }
.cyc-tile{ border:1px solid var(--border); background:var(--surface-2); border-radius:12px; padding:11px 12px; text-align:left; cursor:pointer; color:var(--text); }
.cyc-tile:hover{ border-color:var(--text-muted); }
.cyc-tile.sel{ border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); background:var(--teal-tint); }
.cyc-tile .t1{ font-weight:700; font-size:13px; }
.cyc-tile .t2{ font-size:11.5px; color:var(--text-muted); }
.cyc-tile .pbar{ height:7px; border-radius:6px; background:var(--border); margin:9px 0 6px; overflow:hidden; }
.cyc-tile .pbar span{ display:block; height:100%; background:var(--c-ok); border-radius:6px; }
.cyc-tile .t3{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; }
.cyc-tile .now{ font-size:10.5px; font-weight:700; color:var(--c-mid); margin-left:6px; }
@media (max-width:900px){ .cyc-tiles{ grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:480px){ .cyc-tiles{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.prog-row{ display:grid; grid-template-columns:150px minmax(0,1fr) 70px; gap:12px; align-items:center; padding:6px 0; font-size:13px; }
.prog-row .bar{ height:12px; border-radius:7px; background:var(--surface-2); overflow:hidden; display:flex; gap:1px; }
.prog-row .bar span{ height:100%; }
.prog-row .r{ text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
@media (max-width:520px){ .prog-row{ grid-template-columns:96px minmax(0,1fr) 56px; } }
.uf-group{ margin-bottom:10px; }
.uf-group h4{ margin:8px 0 2px; font-size:13px; font-family:'Space Grotesk',sans-serif; display:flex; justify-content:space-between; }

.empty-state{ text-align:center; padding:40px 20px; color:var(--text-muted); }
.note{ font-size:12px; color:var(--text-muted); margin-top:10px; }
.link-btn{ background:none; border:0; color:var(--c-sav); font-weight:600; cursor:pointer; padding:0; font-size:12.5px; }

/* ===== Tooltip ===== */
.tip{ position:fixed; z-index:100; pointer-events:none; background:#22343F; color:#fff; border-radius:10px; padding:9px 11px; font-size:12.5px; line-height:1.45; box-shadow:var(--shadow-2); max-width:280px; opacity:0; transition:opacity .08s; }
.tip.on{ opacity:1; }
.tip b{ font-family:'Space Grotesk',sans-serif; font-size:13.5px; }
.tip .r{ display:flex; justify-content:space-between; gap:14px; }
.tip .m{ color:rgba(255,255,255,.72); }
</style>

  o.sav = o.vu - o.vf;
  o.kvm = o.col === COL_KVM;
  o.uf = DATA.pts[o.p].uf;
  var mm = periodMonths(DATA.per[o.per], o.cic); o.m0 = mm[0]; o.m1 = mm[1];
  o.start = new Date(o.ano, o.m0-1, 1); o.end = new Date(o.ano, o.m1, 1);
  // período encerrado: o valor da planilha é definitivo (zero = sem custo de freela). Só fica pendente o que ainda está em andamento ou programado.
  o.pend = o.vf === 0 && !o.kvm && NOW < o.end;
  // done: custo lançado ou equipe KVM | open: período atual sem custo | late: período encerrado sem custo | future: período não começou
  o.st = !o.pend ? "done" : (NOW >= o.end ? "late" : (NOW >= o.start ? "open" : "future"));
  return o;
});
var YEARS = uniq(ROWS.map(function(r){return r.ano;})).sort();
var CYCLES = [];
YEARS.forEach(function(y){ [1,2,3].forEach(function(q){ CYCLES.push({ano:y,q:q,key:y+"-"+q}); }); });

// Ciclo em andamento: derivado da data de hoje, limitado ao último ciclo da base
var CUR = (function(){
  var d = new Date(), y = d.getFullYear(), q = Math.ceil((d.getMonth()+1)/4);
  var last = CYCLES[CYCLES.length-1], first = CYCLES[0];
  var k = y*10+q;
  if(k > last.ano*10+last.q) return {ano:last.ano, q:last.q};
  if(k < first.ano*10+first.q) return {ano:first.ano, q:first.q};
  return {ano:y, q:q};
})();
var CUR_KEY = CUR.ano+"-"+CUR.q;

var Q_NAME = {1:"1º quadrimestre", 2:"2º quadrimestre", 3:"3º quadrimestre"};
var Q_MON = {1:"jan–abr", 2:"mai–ago", 3:"set–dez"};

function perLabel(r){
  var pn = DATA.per[r.per];
  if(pn==="Mensal") return cap(MON[r.m0-1])+"/"+r.ano;
  if(pn==="Bimestral") return r.cic+"º bim. "+r.ano+" ("+MON[r.m0-1]+"–"+MON[r.m1-1]+")";
  return r.cic+"º quad. "+r.ano;
}
function perCell(r){
  var pn = DATA.per[r.per];
  if(pn==="Mensal") return [cap(MON[r.m0-1]), ""];
  if(pn==="Bimestral") return [r.cic+"º bimestre", MON[r.m0-1]+"–"+MON[r.m1-1]];
  return [r.cic+"º quadrimestre", MON[r.m0-1]+"–"+MON[r.m1-1]];
}

/* ---------- Utilidades ---------- */
function uniq(a){ var s={}, o=[]; a.forEach(function(x){ if(!s[x]){ s[x]=1; o.push(x); } }); return o; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var nfFull = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
var nfK = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",notation:"compact",maximumFractionDigits:1});
var nfKplain = new Intl.NumberFormat("pt-BR",{notation:"compact",maximumFractionDigits:1});
var nfInt = new Intl.NumberFormat("pt-BR");
var pf = new Intl.NumberFormat("pt-BR",{style:"percent",maximumFractionDigits:1});
var pfs = new Intl.NumberFormat("pt-BR",{style:"percent",maximumFractionDigits:1,signDisplay:"exceptZero"});
function money(v){ return nfFull.format(v).replace(/^-/, "−"); }
function moneyK(v){ return Math.abs(v) < 1000 ? nfFull.format(Math.round(v)).replace(/,00$/,"").replace(/^-/,"−") : nfK.format(v).replace(/^-/,"−"); }
function pct(v){ return pf.format(v).replace(/^-/,"−"); }
function pctS(v){ return pfs.format(v).replace(/^-/,"−"); }
function sum(a,f){ var t=0; for(var i=0;i<a.length;i++) t+=f(a[i]); return t; }
function groupBy(a,f){ var m={}; a.forEach(function(x){ var k=f(x); (m[k]||(m[k]=[])).push(x); }); return m; }

function agg(rows){
  var vu=0, vf=0, sp=0, np=0, nk=0, no=0, nl=0, nf=0;
  for(var i=0;i<rows.length;i++){ var r=rows[i]; vu+=r.vu; vf+=r.vf; if(r.pend){ np++; sp+=r.sav; } if(r.kvm) nk++;
    if(r.st==="open") no++; else if(r.st==="late") nl++; else if(r.st==="future") nf++; }
  var sav = vu-vf;
  return {vu:vu, vf:vf, sav:sav, savPrev:sp, savReal:sav-sp, pct:vu?sav/vu:0, n:rows.length, np:np, nk:nk, nd:rows.length-np, no:no, nl:nl, nf:nf};
}
function statusOf(a){
  if(a.n===0) return "none";
  if(a.nl>0) return "late";
  if(a.no>0) return "open";
  if(a.nf>0) return a.nd>0 ? "open" : "future";
  return "done";
}
var STATUS_TXT = {done:"Concluído", open:"Em andamento", late:"Pendente", future:"Programado", none:"Sem itens"};
var STATUS_HINT = {done:"custo lançado, equipe KVM ou período encerrado", open:"período atual, custo ainda não lançado", late:"período encerrado sem custo lançado", future:"período ainda não começou"};
var STATUS_COLOR = {done:"var(--c-ok)", open:"var(--c-mid)", late:"var(--c-neg)", future:"var(--c-gasto)", none:"var(--c-gasto)"};
var STATUS_ORDER = ["late","open","future","done"];
var LEGEND_ORDER = ["done","open","late","future"];
function itemBadge(r){ return r.kvm ? '<span class="badge kvm">Equipe KVM</span>' : '<span class="badge '+r.st+'">'+STATUS_TXT[r.st]+'</span>'; }
// situação atual de uma unidade (local + característica): item do período em curso, no ritmo da própria unidade
function currentOf(s, car){
  var rr = ROWS.filter(function(r){ return r.s===s && r.car===car; });
  var cur = rr.filter(function(r){ return NOW >= r.start && NOW < r.end; });
  if(!cur.length){
    var past = rr.filter(function(r){ return r.end <= NOW; }).sort(function(a,b){ return b.end - a.end; });
    cur = past.length ? past.filter(function(r){ return +r.end === +past[0].end; }) : [];
  }
  if(!cur.length) return {st:"none", label:""};
  return {st:statusOf(agg(cur)), label:perLabel(cur[0]), per:DATA.per[cur[0].per]};
}
function lateIn(rows){ return rows.filter(function(r){ return r.st==="late"; }).length; }

  var ia = ignore.indexOf("ano")>=0, iq = ignore.indexOf("q")>=0, iu = ignore.indexOf("uf")>=0, ic = ignore.indexOf("col")>=0, is = ignore.indexOf("st")>=0;

    if(!ia && f.ano!=="all" && r.ano !== +f.ano) return false;
    if(!iq && f.q!=="all" && r.q !== +f.q) return false;
    if(f.per!=="all" && r.per !== +f.per) return false;
    if(!ic && f.col!=="all" && r.col !== +f.col) return false;
    if(!iu && f.uf!=="all" && r.uf !== f.uf) return false;
    if(!is && f.st!=="all" && r.st !== f.st) return false;
    return true;
  });
}

/* ---------- Tooltip ---------- */
var tipEl = document.getElementById("tip");
function showTip(html, e){
  tipEl.innerHTML = html; tipEl.classList.add("on"); moveTip(e);
}
function moveTip(e){
  if(!e) return;
  var w = tipEl.offsetWidth, h = tipEl.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
  if(x + w > window.innerWidth - 8) x = e.clientX - w - 14;
  if(y + h > window.innerHeight - 8) y = e.clientY - h - 14;
  tipEl.style.left = Math.max(6,x) + "px"; tipEl.style.top = Math.max(6,y) + "px";
}
function hideTip(){ tipEl.classList.remove("on"); }
function bindTip(el, fn){
  el.addEventListener("pointerenter", function(e){ if(e.pointerType==="touch") return; showTip(fn(), e); });
  el.addEventListener("pointermove", moveTip);
  el.addEventListener("pointerleave", hideTip);
}
function tipRows(title, sub, rows){
  return "<b>"+esc(title)+"</b>"+(sub?"<div class='m'>"+esc(sub)+"</div>":"")+
    rows.map(function(r){ return "<div class='r'><span class='m'>"+esc(r[0])+"</span><span>"+esc(r[1])+"</span></div>"; }).join("");
}

/* ---------- Mapa ---------- */
var BASE_VB = {x:-14, y:-10, w:984, h:1000};
function project(lon, lat){ var P = GEO.proj; return [(lon-P[0])*P[3]*P[2], (P[1]-lat)*P[2]]; }
DATA.pts.forEach(function(p){ var xy = project(p.lon, p.lat); p.x = xy[0]; p.y = xy[1]; });
function ufBox(uf){
  var b = GEO.ufs[uf].b, w = b[2]-b[0], h = b[3]-b[1];
  var pad = Math.max(w,h)*0.14 + 14;
  return {x:b[0]-pad, y:b[1]-pad, w:w+2*pad, h:h+2*pad};
}
function easeIO(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* cfg: id, points[{p,v,color,dim}], ufTint{uf:0..1}, selPoint, onPoint(p|null), onUF(uf), tipPoint(p), tipUF(uf), legend(html), aria */
function buildMap(host, cfg){
  var mv = state.maps[cfg.id] || (state.maps[cfg.id] = {vb:Object.assign({},BASE_VB), focus:"BR", anim:0});
  var wrap = document.createElement("div"); wrap.className = "map-wrap";
  var svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class","map-svg"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label", cfg.aria || "Mapa do Brasil");
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  var bg = document.createElementNS(NS,"rect");
  bg.setAttribute("x",-3000); bg.setAttribute("y",-3000); bg.setAttribute("width",7000); bg.setAttribute("height",7000); bg.setAttribute("fill","transparent");
  svg.appendChild(bg);

  var gU = document.createElementNS(NS,"g"), gL = document.createElementNS(NS,"g"), gP = document.createElementNS(NS,"g"), gT = document.createElementNS(NS,"g");
  svg.appendChild(gU); svg.appendChild(gL); svg.appendChild(gP); svg.appendChild(gT);
  var tint = cfg.ufTint || {};
  Object.keys(GEO.ufs).forEach(function(uf){
    var u = GEO.ufs[uf], path = document.createElementNS(NS,"path");
    path.setAttribute("d", u.d);
    var has = tint[uf] != null;
    path.setAttribute("class","uf"+(has?" has":"")+(state.f.uf===uf?" sel":""));
    if(has){
      var pc = Math.round(12 + 38*tint[uf]);
      path.style.fill = "color-mix(in srgb, var(--c-sav) "+pc+"%, var(--map-land))";
      path.addEventListener("click", function(e){ if(mv.dragged) return; e.stopPropagation(); cfg.onUF(uf); });
      if(cfg.tipUF) bindTip(path, function(){ return cfg.tipUF(uf); });
    }
    gU.appendChild(path);
    if(has){
      var t = document.createElementNS(NS,"text");
      t.setAttribute("class","uf-lbl"); t.setAttribute("x",u.c[0]); t.setAttribute("y",u.c[1]); t.textContent = uf;
      t._uf = uf; gL.appendChild(t);
    }
  });
  // pontos (maiores primeiro)
  var pts = cfg.points.slice().sort(function(a,b){ return b.v - a.v; });
  var vmax = Math.max.apply(null, pts.map(function(p){return p.v;}).concat([1]));
  var circles = [], labels = [];
  pts.forEach(function(o){
    var P = DATA.pts[o.p], c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",P.x); c.setAttribute("cy",P.y);
    c.setAttribute("class","pt"+(cfg.selPoint===o.p?" sel":"")+(o.dim?" dim":""));
    c.setAttribute("fill", o.color);
    c.setAttribute("tabindex","0");
    c.setAttribute("aria-label", P.n+", "+P.uf);
    c._r = 4.5 + 17*Math.sqrt(Math.max(0,o.v)/vmax);
    c.addEventListener("click", function(e){ if(mv.dragged) return; e.stopPropagation(); hideTip(); cfg.onPoint(o.p); });
    c.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cfg.onPoint(o.p); } });
    if(cfg.tipPoint) bindTip(c, function(){ return cfg.tipPoint(o.p); });
    gP.appendChild(c); circles.push(c);
    var t = document.createElementNS(NS,"text"); t.setAttribute("class","pt-lbl"); t.textContent = P.n; t._c = c; t._p = P; t._v = o.v;
    gT.appendChild(t); labels.push(t);
  });
  // seleção traz o ponto para frente
  circles.forEach(function(c){ if(c.classList.contains("sel")) gP.appendChild(c); });

  svg.addEventListener("click", function(){ if(mv.dragged) return; if(cfg.onPoint && cfg.selPoint!=null) cfg.onPoint(null); });

  function upp(){ var cw = svg.clientWidth || 600, ch = svg.clientHeight || 500; return Math.max(mv.vb.w/cw, mv.vb.h/ch); }
  function apply(){
    var vb = mv.vb;
    svg.setAttribute("viewBox", vb.x+" "+vb.y+" "+vb.w+" "+vb.h);
    var u = upp(), k = BASE_VB.w / vb.w, grow = Math.pow(Math.max(1,k), 0.28);
    circles.forEach(function(c){ c.setAttribute("r", (c._r*grow*u).toFixed(2)); });
    gL.querySelectorAll("text").forEach(function(t){ t.setAttribute("font-size", (11*u).toFixed(2)); });
    // rótulos dos pontos quando há zoom, sem sobreposição
    var placed = [];
    var showLbl = k >= 2.1;
    labels.forEach(function(t){
      if(!showLbl){ t.style.display = "none"; return; }
      var r = parseFloat(t._c.getAttribute("r"));
      var fs = 11.5*u, w = t._p.n.length * 6.6 * u, h = 14*u;
      var x = t._p.x + r + 3*u, y = t._p.y + 4*u;
      var box = [x, y-h+2*u, x+w, y+3*u];
      var hit = placed.some(function(b){ return !(box[2]<b[0]||box[0]>b[2]||box[3]<b[1]||box[1]>b[3]); });
      if(hit){ t.style.display = "none"; return; }
      placed.push(box);
      t.style.display = ""; t.setAttribute("x",x); t.setAttribute("y",y); t.setAttribute("font-size",fs.toFixed(2));
      t.style.strokeWidth = (3*u).toFixed(2)+"px";
    });
  }
  function clampVb(v){
    var w = Math.max(70, Math.min(BASE_VB.w*1.15, v.w)), h = w * (BASE_VB.h/BASE_VB.w);
    var cx = v.x + v.w/2, cy = v.y + v.h/2;
    cx = Math.max(-100, Math.min(1080, cx)); cy = Math.max(-100, Math.min(1100, cy));
    return {x:cx-w/2, y:cy-h/2, w:w, h:h};
  }
  function animateTo(target){
    target = clampVb(target);
    var from = Object.assign({}, mv.vb), t0 = performance.now(), dur = reduceMotion ? 0 : 480, id = ++mv.anim;
    function step(now){
      if(id !== mv.anim) return;
      var t = dur ? Math.min(1, (now - t0)/dur) : 1, e = easeIO(t);
      mv.vb = {x:from.x+(target.x-from.x)*e, y:from.y+(target.y-from.y)*e, w:from.w+(target.w-from.w)*e, h:from.h+(target.h-from.h)*e};
      apply();
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function zoomBy(f, cx, cy){
    var vb = mv.vb; if(cx==null){ cx = vb.x+vb.w/2; cy = vb.y+vb.h/2; }
    var w = vb.w*f, h = vb.h*f;
    return {x:cx-(cx-vb.x)*f, y:cy-(cy-vb.y)*f, w:w, h:h};
  }
  // arrastar (mouse)
  var drag = null;
  svg.addEventListener("pointerdown", function(e){
    mv.dragged = false;
    if(e.pointerType !== "mouse" || e.button !== 0) return;
    drag = {x:e.clientX, y:e.clientY, vb:Object.assign({},mv.vb), id:e.pointerId};
  });
  svg.addEventListener("pointermove", function(e){
    if(!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!mv.dragged && Math.hypot(dx,dy) < 5) return;
    if(!mv.dragged){ mv.dragged = true; svg.classList.add("dragging"); try{ svg.setPointerCapture(drag.id); }catch(_){} hideTip(); }
    var u = upp(); mv.anim++;
    mv.vb = clampVb({x:drag.vb.x - dx*u, y:drag.vb.y - dy*u, w:drag.vb.w, h:drag.vb.h}); apply();
  });
  function endDrag(){ if(drag){ drag = null; svg.classList.remove("dragging"); setTimeout(function(){ mv.dragged = false; }, 0); } }
  svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("wheel", function(e){
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    var r = svg.getBoundingClientRect(), u = upp(), vb = mv.vb;
    var offX = (r.width - vb.w/u)/2, offY = (r.height - vb.h/u)/2;
    var cx = vb.x + (e.clientX - r.left - offX)*u, cy = vb.y + (e.clientY - r.top - offY)*u;
    mv.anim++; mv.vb = clampVb(zoomBy(Math.pow(1.0018, e.deltaY), cx, cy)); apply();
  }, {passive:false});
  svg.addEventListener("dblclick", function(e){ e.preventDefault(); animateTo(zoomBy(0.55)); });

  var ctrl = document.createElement("div"); ctrl.className = "map-ctrl";
  ctrl.innerHTML = '<button type="button" data-z="in" aria-label="Aproximar">+</button><button type="button" data-z="out" aria-label="Afastar">−</button><button type="button" data-z="reset" aria-label="Ver o Brasil inteiro" title="Ver o Brasil inteiro">⤢</button>';
  ctrl.querySelector('[data-z="in"]').onclick = function(){ animateTo(zoomBy(0.6)); };
  ctrl.querySelector('[data-z="out"]').onclick = function(){ animateTo(zoomBy(1/0.6)); };
  ctrl.querySelector('[data-z="reset"]').onclick = function(){
    if(state.f.uf !== "all"){ cfg.onUF(state.f.uf); } else animateTo(BASE_VB);
  };
  wrap.appendChild(svg); wrap.appendChild(ctrl);
  if(cfg.legend){ var lg = document.createElement("div"); lg.className = "map-legend"; lg.innerHTML = cfg.legend; wrap.appendChild(lg); }
  var hint = document.createElement("div"); hint.className = "map-hint"; hint.textContent = "Arraste para mover · Ctrl + rolagem para zoom";
  wrap.appendChild(hint);
  host.appendChild(wrap);

  // foco no estado filtrado
  var focus = state.f.uf !== "all" && GEO.ufs[state.f.uf] ? state.f.uf : "BR";
  apply();
  if(focus !== mv.focus){ mv.focus = focus; animateTo(focus==="BR" ? BASE_VB : ufBox(focus)); }
  if(mv.ro){ try{ mv.ro.disconnect(); }catch(_){} }
  if(window.ResizeObserver){ mv.ro = new ResizeObserver(function(){ apply(); }); mv.ro.observe(svg); }
  else { if(mv.onRs) window.removeEventListener("resize", mv.onRs); mv.onRs = apply; window.addEventListener("resize", apply); }
  return {apply:apply};
}

function insightsHTML(){
  // 1. participação por modelo de atendimento
  var rA = filt(["col"]), byC = groupBy(rA, function(r){ return r.col; });
  var tot = agg(rA).sav, best = null;
  Object.keys(byC).forEach(function(c){ var a = agg(byC[c]); if(!best || a.sav > best.a.sav) best = {c:+c, a:a}; });
  var share = best && tot > 0 ? best.a.sav/tot : 0;
  var i1 = best && best.a.sav > 0 ? (share > 0 && share <= 1
      ? {t: DATA.col[best.c]+": "+pct(share)+" do saving", s:"É o modelo que mais economiza: "+moneyK(best.a.sav)+", com economia de "+pct(best.a.pct)+" sobre o valor unitário.", c:"var(--c-sav)"}
      : {t: DATA.col[best.c]+": "+moneyK(best.a.sav)+" de saving", s:"É o modelo que mais economiza ("+pct(best.a.pct)+" sobre o valor unitário). Os outros modelos somam "+moneyK(tot-best.a.sav)+".", c:"var(--c-sav)"})
                          : {t:"Sem saving no recorte", s:"Os filtros atuais não têm saving positivo.", c:"var(--c-gasto)"};
  // 2. onde o freela saiu mais caro
  var rB = filt(["col","ano"]), worst = null;
  YEARS.forEach(function(y){ DATA.col.forEach(function(_,c){
    var a = agg(rB.filter(function(r){ return r.ano===y && r.col===c; }));
    if(a.n && a.sav < 0 && (!worst || a.sav < worst.a.sav)) worst = {y:y, c:c, a:a};
  }); });
  var i2 = worst ? {t: DATA.col[worst.c]+" em "+worst.y+": "+moneyK(-worst.a.sav)+" acima", s:"Nesse modelo o gasto com freelas passou o valor unitário. Vale revisar os deslocamentos mais caros na aba Localidades.", c:"var(--c-neg)"}
                 : {t:"Nenhum modelo acima do valor unitário", s:"Em todos os modelos de atendimento o gasto ficou abaixo da base.", c:"var(--c-ok)"};
  // 3. ciclo em andamento
  var rC = filt(["ano","q","st"]).filter(function(r){ return r.ano===CUR.ano && r.q===CUR.q; }), aC = agg(rC);
  var parts3 = []; if(aC.no) parts3.push(aC.no+" em andamento"); if(aC.nl) parts3.push(aC.nl+" pendente"+(aC.nl>1?"s":"")); if(aC.nf) parts3.push(aC.nf+" programado"+(aC.nf>1?"s":""));
  var i3 = aC.n ? {t: cycShort(CUR.ano,CUR.q)+": "+aC.nd+" de "+aC.n+" itens concluídos", s: aC.np ? moneyK(aC.savPrev)+" do saving desse ciclo ainda é previsão. Sem valor de freela: "+parts3.join(", ")+"." : "Todos os itens do ciclo já têm custo lançado.", c:"var(--c-mid)"}
                : {t:"Ciclo atual sem itens", s:"Nenhum item do ciclo em andamento com os filtros atuais.", c:"var(--c-gasto)"};
  return '<section class="card insights" aria-label="Leitura rápida">'+[i1,i2,i3].map(function(i){
    return '<div class="insight"><span class="mark" style="background:'+i.c+'"></span><div><b>'+esc(i.t)+'</b><span>'+esc(i.s)+'</span></div></div>';
  }).join("")+'</section>';
}

      '<span><span class="nm" style="display:block">'+esc(GEO.ufs[u].n)+'</span><span class="track" style="display:block"><span class="fill'+(v<0?" neg":"")+'" style="width:'+(Math.abs(v)/mx*100).toFixed(1)+'%"></span></span></span>'+

}

/* Gráfico: evolução por ciclo (valor unitário = gasto + saving) */
function cycleChartCard(){
  var rows = filt(["ano","q"]), f = state.f;
  var data = [];
  [1,2,3].forEach(function(q){ YEARS.forEach(function(y){
    var a = agg(rows.filter(function(r){ return r.ano===y && r.q===q; }));
    data.push({q:q, y:y, a:a});
  }); });
  var W = 520, H = 312, ml = 46, mr = 6, mt = 54, mb = 62;
  var max = Math.max.apply(null, data.map(function(d){ return Math.max(d.a.vu, d.a.vf, d.a.vf + d.a.savPrev); }).concat([1])) * 1.04;
  var nice = niceMax(max), ih = H - mt - mb, iw = W - ml - mr;
  function Y(v){ return mt + ih - v/nice*ih; }
  var gw = iw/3, bw = Math.min(54, gw*0.3), gap = 12;
  var hasNeg = data.some(function(d){ return d.a.savReal < 0; }), hasPrev = data.some(function(d){ return d.a.savPrev > 0.5; });
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto e saving por ciclo, 2025 e 2026">'+
    '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--c-sav)" opacity=".18"/><rect width="2.4" height="6" fill="var(--c-sav)" opacity=".85"/></pattern></defs>';
  for(var i=0;i<=4;i++){ var v = nice*i/4, yy = Y(v);
    s += '<line class="grid" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(ml-8)+'" y="'+(yy+4)+'" text-anchor="end">'+(v?nfKplain.format(v):"0")+'</text>'; }
  data.forEach(function(d, idx){
    var gi = d.q-1, yi = YEARS.indexOf(d.y);
    var cx = ml + gw*gi + gw/2 + (yi===0 ? -(bw/2+gap/2) : (bw/2+gap/2));
    var x = cx - bw/2, a = d.a;
    var selected = (f.ano==="all"||+f.ano===d.y) && (f.q==="all"||+f.q===d.q);
    var segs = [];
    var refReal = a.vf + a.savReal;
    if(a.savReal >= 0){ segs.push([0,a.vf,"var(--c-gasto)"]); segs.push([a.vf, refReal, "var(--c-sav)"]); }
    else { segs.push([0, refReal, "var(--c-gasto)"]); segs.push([refReal, a.vf, "var(--c-neg)"]); }
    var top = Math.max(a.vf, refReal);
    if(a.savPrev > 0.5){ segs.push([top, top + a.savPrev, "url(#hatch)"]); top += a.savPrev; }
    var isCur = d.y===CUR.ano && d.q===CUR.q;
    s += '<g class="hit'+(selected?"":" dimmed")+'" data-y="'+d.y+'" data-q="'+d.q+'" data-i="'+idx+'" tabindex="0" role="button" aria-label="'+cycShort(d.y,d.q)+': saving '+money(a.sav)+'">';
    s += '<rect x="'+(x-4)+'" y="'+mt+'" width="'+(bw+8)+'" height="'+ih+'" fill="transparent"/>';
    segs.forEach(function(g){ if(g[1]-g[0] <= 0) return; s += '<rect class="seg-r" x="'+x+'" y="'+Y(g[1])+'" width="'+bw+'" height="'+Math.max(0.5, Y(g[0])-Y(g[1]))+'" fill="'+g[2]+'" rx="2"/>'; });
    if(a.n){
      if(isCur) s += '<text class="lbl-s" x="'+cx+'" y="'+(Y(top)-31)+'" text-anchor="middle" style="fill:var(--c-mid);font-weight:700">em andamento</text>';
      s += '<text class="lbl num" x="'+cx+'" y="'+(Y(top)-18)+'" text-anchor="middle">'+moneyK(a.sav).replace(/R\$\s?/,"")+'</text>';
      s += '<text class="lbl-s" x="'+cx+'" y="'+(Y(top)-6)+'" text-anchor="middle">'+pct(a.pct)+'</text>';
    }
    s += '<text class="ax" x="'+cx+'" y="'+(H-mb+16)+'" text-anchor="middle">'+d.y+'</text>';
    s += '</g>';
  });
  [1,2,3].forEach(function(q){ var cx = ml + gw*(q-1) + gw/2;
    s += '<text class="grp" x="'+cx+'" y="'+(H-22)+'" text-anchor="middle">'+Q_NAME[q]+'</text><text class="ax" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+Q_MON[q]+'</text>'; });
  s += '</svg>';
  var legend = '<div class="legend"><span><i style="background:var(--c-gasto)"></i>Gasto com freelas</span><span><i style="background:var(--c-sav)"></i>Saving</span>'+
    (hasPrev?'<span><i class="hatch"></i>Sem custo de freela lançado</span>':'')+
    (hasNeg?'<span><i style="background:var(--c-neg)"></i>Gasto acima do valor unitário</span>':'')+'</div>';
  var card = el('<section class="card"><div class="card-head"><div><h3>Gasto e saving por ciclo</h3><p>Cada barra é o valor unitário do ciclo, dividido entre o que foi pago aos freelas e o que foi economizado. O número em cima é o saving. Itens mensais e bimestrais entram no quadrimestre do mês correspondente. Clique em uma barra para filtrar.</p></div></div>'+s+legend+'</section>');
  card.querySelectorAll("g.hit").forEach(function(g){
    var d = data[+g.getAttribute("data-i")];

    {k:"vu", t:"Valor unitário"}, {k:"vf", t:"Gasto com freelas"}, {k:"sav", t:"Saving"}, {k:"pct", t:"Economia"}, {k:"nl", t:"Pendências"}, {k:"st", t:"Situação atual", txt:true}
  ];
  var TXT_KEYS = ["name","uf","carN","perN","cols","st"];
  function val(o,k){ if(k==="vu"||k==="vf"||k==="sav"||k==="pct") return o.a[k]; if(k==="st") return String(STATUS_ORDER.indexOf(o.st)); return o[k]; }
  function drawTable(){
    var q = state.locSearch.trim().toLowerCase();
    var L = items.filter(function(o){ return !q || (o.name+" "+o.city+" "+o.uf+" "+GEO.ufs[o.uf].n+" "+o.carN+" "+o.cols+" "+o.perN).toLowerCase().indexOf(q) >= 0; });
    var sk = state.locSort.k, sd = state.locSort.dir;
    L.sort(function(x,y){ var a = val(x,sk), b = val(y,sk); if(typeof a === "string") return a.localeCompare(b,"pt-BR")*sd; return (a-b)*sd; });
    var h = '<table class="tbl"><thead><tr>'+cols.map(function(c){ var on = c.k===sk;
      return '<th class="sort'+(c.txt?" txt":"")+(on?" on":"")+'" data-k="'+c.k+'" aria-sort="'+(on?(sd>0?"ascending":"descending"):"none")+'" tabindex="0">'+esc(c.t)+(on?(sd>0?" ▲":" ▼"):"")+'</th>'; }).join("")+'</tr></thead><tbody>';
    L.forEach(function(o){
      var open = state.locOpen === o.k;
      h += '<tr class="click'+(open?" open":"")+'" data-k="'+esc(o.k)+'" tabindex="0" aria-expanded="'+open+'"><td class="wrap-cell"><b>'+esc(o.name)+'</b><div class="cell-sub">'+o.uf+' · '+esc(GEO.ufs[o.uf].n)+'</div></td><td class="txt" style="white-space:normal;min-width:140px">'+esc(o.carN)+'<div class="cell-sub">'+esc(o.perN)+'</div></td><td class="txt" style="white-space:normal;min-width:110px">'+esc(o.cols)+'</td>'+
        '<td>'+money(o.a.vu)+'</td><td>'+money(o.a.vf)+'</td><td class="'+(o.a.sav<0?"neg":"")+'"><b>'+money(o.a.sav)+'</b></td><td>'+pct(o.a.pct)+'</td>'+
        '<td'+(o.nl?' style="color:var(--c-neg);font-weight:700"':' style="color:var(--text-muted)"')+'>'+(o.nl||"–")+'</td>'+
        '<td class="txt">'+(o.st!=="none"?'<span class="badge '+o.st+'">'+STATUS_TXT[o.st]+'</span><div class="cell-sub">'+esc(o.cur.label)+'</div>':'<span style="color:var(--text-muted)">–</span>')+'</td></tr>';
      if(open){
        var rr = allRows.filter(function(r){ return r.s===o.s && r.car===o.car; });
        var gp = groupBy(rr, function(r){ return r.ano+"|"+r.per+"|"+r.cic; });
        var periods = Object.keys(gp).map(function(k){ var x = gp[k]; return {r:x[0], a:agg(x), st:statusOf(agg(x))}; }).sort(function(x,y){ return x.r.start - y.r.start || x.r.per - y.r.per; });
        var byYear = groupBy(periods, function(pp){ return pp.r.ano; });
        var inner = Object.keys(byYear).sort().map(function(y){
          return '<div class="mini-title" style="margin:10px 0 6px">'+y+(byYear[y][0]?' · '+esc(DATA.per[byYear[y][0].r.per]):'')+'</div><div class="cyc-mini">'+byYear[y].map(function(pp){
            var a = pp.a, pc = perCell(pp.r);
            return '<div><b>'+esc(pc[0])+(pc[1]?' <span class="ms">'+esc(pc[1])+'</span>':'')+'</b>'+
              '<div class="rr"><span>Gasto</span><span>'+moneyK(a.vf)+'</span></div>'+
              '<div class="rr"><span>Saving</span><span class="'+(a.sav<0?"neg":"pos")+'" style="font-weight:600">'+moneyK(a.sav)+'</span></div>'+
              (pp.st!=="done"?'<span class="badge '+pp.st+'">'+STATUS_TXT[pp.st]+'</span>':'')+'</div>';
          }).join("")+'</div>';
        }).join("");
        h += '<tr class="sub"><td colspan="'+cols.length+'">'+(inner || '<div class="empty-state">Sem itens com esses filtros.</div>')+'</td></tr>';
      }
    });
    if(!L.length) h += '<tr><td colspan="'+cols.length+'"><div class="empty-state">Nenhuma localidade encontrada. Tente outro termo ou limpe os filtros.</div></td></tr>';
    var T = agg([].concat.apply([], L.map(function(o){ return g[o.k]; })));
    if(L.length) h += '<tr class="total"><td colspan="3">Total ('+L.length+' linhas)</td><td>'+money(T.vu)+'</td><td>'+money(T.vf)+'</td><td>'+money(T.sav)+'</td><td>'+pct(T.pct)+'</td><td>'+(T.nl||"–")+'</td><td></td></tr>';
    h += '</tbody></table>';
    var tw = card.querySelector(".tbl-wrap"); tw.innerHTML = h;
    card.querySelector(".note").textContent = "Situação atual mostra o período em curso de cada unidade: o mês para as mensais, o bimestre para as bimestrais e o quadrimestre para as demais. Pendências conta os períodos já encerrados sem custo de freela lançado.";
    tw.querySelectorAll("th.sort").forEach(function(th){
      function act(){ var k = th.getAttribute("data-k"); if(state.locSort.k===k) state.locSort.dir *= -1; else state.locSort = {k:k, dir:TXT_KEYS.indexOf(k)>=0?1:-1}; drawTable(); }
      th.onclick = act; th.onkeydown = function(e){ if(e.key==="Enter"){ act(); } };
    });
    tw.querySelectorAll("tr.click").forEach(function(tr){
      function act(){ var k = tr.getAttribute("data-k"); state.locOpen = state.locOpen===k ? null : k; drawTable(); }
      tr.onclick = act; tr.onkeydown = function(e){ if(e.key==="Enter"){ e.preventDefault(); act(); } };
    });
  }
  drawTable();
}

/* ---------- Render ---------- */
function render(){
  renderNav(); renderTopbar();
  var app = document.getElementById("app");
  app.innerHTML = "";
  if(state.view === "overview") renderOverview(app);
  else if(state.view === "andamento") renderAndamento(app);
  else renderLocais(app);
}
render();
})();

</script>
</body>
</html>

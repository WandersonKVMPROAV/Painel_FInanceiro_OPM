<title>KVM Pro AV | Controle financeiro OPM's</title>
<style>
:root{ --navy:#2E4756; --teal:#1C7A88; --teal-dark:#125A66; --gold:#D9A04B; --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --muted:#93A2A6; --neg:#E27C6F;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#F2F5F5; --surface:#FFFFFF; --border:#DFE6E5; --text:#20303A; --muted:#5C6870; --neg:#C1584B; } }
:root[data-theme="dark"]{ --bg:#0F1517; --surface:#182024; --border:#283134; --text:#EAF0EF; --muted:#93A2A6; }
*{box-sizing:inherit} html,body{height:100%;margin:0}
body{ background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; display:flex; align-items:center; justify-content:center; padding:20px; }
.box{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); }
.top{ background:linear-gradient(135deg,var(--navy) 0%,var(--teal-dark) 100%); padding:22px 24px; color:#fff; }
.top img{ height:32px; display:block; margin-bottom:12px; }
.top h1{ margin:0; font-size:18px; } .top p{ margin:4px 0 0; font-size:13px; color:rgba(255,255,255,.8); }
form{ padding:22px 24px 24px; display:flex; flex-direction:column; gap:12px; }
label{ font-size:13px; font-weight:600; }
input[type=password]{ width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; margin-top:6px; }
.chk{ display:flex; gap:8px; align-items:center; font-weight:500; color:var(--muted); }
button{ border:0; border-radius:9px; padding:11px; font-weight:700; font-size:14px; background:var(--teal); color:#fff; cursor:pointer; }
button:hover{ background:var(--teal-dark); } button:disabled{ opacity:.6; cursor:wait; }
.err{ color:var(--neg); font-size:13px; min-height:18px; margin:0; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>

  var KEY = "kvm-painel-key";
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function hex(u){ return Array.prototype.map.call(u, function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); }
  function unhex(h){ var u = new Uint8Array(h.length/2); for(var i=0;i<u.length;i++) u[i]=parseInt(h.substr(i*2,2),16); return u; }
  var err = document.getElementById("err"), go = document.getElementById("go");
  if(!(window.crypto && crypto.subtle)){ err.textContent = "Este navegador não suporta a abertura segura. Use Chrome, Edge, Firefox ou Safari atualizados."; go.disabled = true; return; }
  function open(raw){
    return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["decrypt"]).then(function(k){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct));
    }).then(function(buf){
      var html = new TextDecoder().decode(buf);
      try{ sessionStorage.setItem("kvm-shell","1"); }catch(e){}
      document.open(); document.write(html); document.close();
    });
  }
  function derive(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]).then(function(base){
      return crypto.subtle.deriveBits({name:"PBKDF2", salt:b64(P.salt), iterations:P.it, hash:"SHA-256"}, base, 256);
    }).then(function(bits){ return new Uint8Array(bits); });
  }
  // chave lembrada neste dispositivo (só vale para esta versão do arquivo)
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if(saved && saved.v === P.v){ open(unhex(saved.k)).catch(function(){ localStorage.removeItem(KEY); }); }
  }catch(e){}
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault(); err.textContent = ""; go.disabled = true; go.textContent = "Abrindo…";
    var pw = document.getElementById("pw").value, rem = document.getElementById("rem").checked, raw;
    derive(pw).then(function(r){ raw = r; return open(raw); }).then(function(){
      if(rem){ try{ localStorage.setItem(KEY, JSON.stringify({v:P.v, k:hex(raw)})); }catch(e){} }
    }).catch(function(){
      go.disabled = false; go.textContent = "Abrir painel";
      err.textContent = "Senha incorreta. Confira a senha com quem enviou o link.";
    });
  });
})();
